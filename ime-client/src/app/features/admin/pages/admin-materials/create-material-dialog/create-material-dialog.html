<div class="dialog">

  <header>
    <div class="header-icon">
      <mat-icon>
        upload_file
      </mat-icon>
    </div>

    <div>
      <h2>
        Новый материал
      </h2>

      <p>
        Добавление учебного или общего материала
      </p>
    </div>

    <button
      type="button"
      (click)="close()"
    >
      <mat-icon>
        close
      </mat-icon>
    </button>
  </header>


  <div class="form">

    <label>
      <span>
        Тип материала *
      </span>

      <mat-select
        [ngModel]="type"
        (ngModelChange)="setType($event)"
      >
        <mat-option value="FILE">
          Файл
        </mat-option>

        <mat-option value="LINK">
          Ссылка
        </mat-option>
      </mat-select>
    </label>


    <label>
      <span>
        Дисциплина
      </span>

      <mat-select
        [(ngModel)]="subjectId"
        placeholder="Без привязки к дисциплине"
      >
        <mat-option value="">
          Без привязки к дисциплине
        </mat-option>

        @for (
          subject of data.subjects;
          track subject.id
        ) {
          <mat-option
            [value]="subject.id"
          >
            {{ subject.name }}
          </mat-option>
        }
      </mat-select>

      <small class="field-hint">
        Можно не выбирать дисциплину,
        например для расписания,
        объявления или общего документа.
      </small>
    </label>


    <label>
      <span>
        Название *
      </span>

      <input
        [(ngModel)]="title"
        placeholder="Например: Расписание занятий"
      />
    </label>


    <label>
      <span>
        Описание
      </span>

      <textarea
        [(ngModel)]="description"
        rows="4"
        placeholder="Описание материала..."
      ></textarea>
    </label>


    @if (type === 'FILE') {

      <label>
        <span>
          Файл *
        </span>

        <input
          type="file"
          (change)="selectFile($event)"
        />
      </label>

      @if (file) {
        <div class="selected-file">
          <mat-icon>
            description
          </mat-icon>

          <div>
            <strong>
              {{ file.name }}
            </strong>

            <span>
              Файл выбран
            </span>
          </div>
        </div>
      }

    } @else {

      <label>
        <span>
          Ссылка *
        </span>

        <input
          [(ngModel)]="url"
          placeholder="https://..."
        />
      </label>

    }


    @if (error()) {
      <div class="error">
        <mat-icon>
          error_outline
        </mat-icon>

        {{ error() }}
      </div>
    }

  </div>


  <footer>
    <button
      type="button"
      class="cancel"
      (click)="close()"
    >
      Отмена
    </button>

    <button
      type="button"
      class="save"
      [disabled]="saving()"
      (click)="save()"
    >
      @if (saving()) {
        Сохранение…
      } @else {
        <mat-icon>
          upload
        </mat-icon>

        Добавить материал
      }
    </button>
  </footer>

</div>
